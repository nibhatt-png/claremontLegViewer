name: Sync Legistar

on:
  schedule:
    # GitHub cron runs in UTC; Pacific time shifts by an hour with daylight saving.
    - cron: "0 10 * * *"     # nightly: 2 am PST / 3 am PDT
    - cron: "0 23 * * 4,5"   # Thursday and Friday: 3 pm PST / 4 pm PDT (agendas post Thursdays)
    - cron: "0 1 * * 5,6"    # Thursday and Friday evening: 5 pm PST / 6 pm PDT
  workflow_dispatch:
    inputs:
      args:
        description: "Extra arguments for pipeline.sync (e.g. --full or --dry-run)"
        required: false
        default: ""

concurrency:
  group: legistar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Apply database migrations
        run: python -m pipeline.migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync meetings, PDFs, and summaries
        run: python -m pipeline.sync $SYNC_ARGS
        env:
          SYNC_ARGS: ${{ github.event.inputs.args }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
